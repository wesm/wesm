<svg width="800" height="220" viewBox="0 0 800 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .hero {
          width: 800px; height: 220px;
          padding: 36px 44px 32px;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
          background: linear-gradient(135deg, #f0f4f8 0%, #ffffff 50%, #f0f4f8 100%);
          position: relative;
          overflow: hidden;
        }
        .hero-glow {
          position: absolute; top: -60px; right: -40px;
          width: 300px; height: 300px;
          background: radial-gradient(circle, rgba(0,102,255,0.06) 0%, transparent 70%);
          pointer-events: none;
        }
        .hero-name {
          font-size: 34px; font-weight: 700; color: #1a1a2e;
          letter-spacing: -0.5px; margin-bottom: 6px;
        }
        .hero-tagline {
          font-size: 15px; color: #586069; line-height: 1.5;
          margin-bottom: 20px;
        }
        .hero-tagline b { color: #0066ff; font-weight: 600; }
        .pills {
          display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px;
        }
        .pill {
          background: rgba(0,102,255,0.08); border: 1px solid rgba(0,102,255,0.18);
          padding: 4px 13px; border-radius: 16px;
          font-size: 12px; color: #0066ff; white-space: nowrap;
        }
        .links {
          display: flex; gap: 20px;
        }
        .links a {
          color: #586069; text-decoration: none; font-size: 13px;
        }
        @media (prefers-color-scheme: dark) {
          .hero {
            background: linear-gradient(135deg, #0a1628 0%, #0d1117 50%, #0a1628 100%);
          }
          .hero-glow {
            background: radial-gradient(circle, rgba(56,139,253,0.1) 0%, transparent 70%);
          }
          .hero-name { color: #f0f6fc; }
          .hero-tagline { color: #8b949e; }
          .hero-tagline b { color: #58a6ff; }
          .pill {
            background: rgba(56,139,253,0.1); border-color: rgba(56,139,253,0.2);
            color: #58a6ff;
          }
          .links a { color: #8b949e; }
        }
      </style>
      <div class="hero">
        <div class="hero-glow"></div>
        <div class="hero-name">Wes McKinney</div>
        <div class="hero-tagline">
          Creator of <b>pandas</b>  &#xb7;  Co-creator of <b>Apache Arrow</b> and <b>Ibis</b>
        </div>
        <div class="pills">
          <span class="pill">Principal Architect @ Posit</span>
          <span class="pill">GP @ Composed Ventures</span>
          <span class="pill">Apache Member</span>
        </div>
        <div class="links">
          <a href="https://wesmckinney.com/archives.html">Blog</a>
          <a href="https://amzn.to/3DyLaJc">Book</a>
          <a href="https://github.com/sponsors/wesm">Sponsor</a>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>